manifest_version = 1

# jess's built-in package: the Luau libraries and tools every runtime can require. It is the one
# package that may export under @jess/, jess's own namespace.

[package]
id = "org.dreamweave.jess"
version = "0.1.0"
jess_api = "1"
include = ["src", "tests"]
tests = [
  "tests/style/run.jsl",
  "tests/data/run.jsl",
  "tests/analysis/run.jsl",
  "tests/l10n/run.jsl",
  "tests/input/run.jsl",
  "tests/audio/run.jsl",
  "tests/audio/adaptive.jsl",
  "tests/backup/run.jsl",
  "tests/http/run.jsl",
]

[modules]
"@jess/style" = "src/style/init.jsl"
"@jess/analysis" = "src/analysis/init.jsl"
"@jess/json" = "src/data/json.jsl"
"@jess/data/toml" = "src/data/toml.jsl"
"@jess/data/value" = "src/data/value.jsl"
"@jess/yaml" = "src/data/yaml.jsl"
"@jess/l10n" = "src/l10n/init.jsl"
"@jess/input" = "src/input/init.jsl"
"@jess/audio" = "src/audio/init.jsl"
"@jess/backup" = "src/backup/init.jsl"
"@jess/http" = "src/http/init.jsl"

[[layer]]
id = "jess.style"
exports = ["@jess/style", "@jess/analysis"]

[[layer]]
id = "jess.data"
exports = ["@jess/json", "@jess/data/toml", "@jess/data/value", "@jess/yaml"]

[[layer]]
id = "jess.l10n"
exports = ["@jess/l10n"]

[[layer]]
id = "jess.input"
exports = ["@jess/input"]

[[layer]]
id = "jess.audio"
exports = ["@jess/audio"]

[[layer]]
id = "jess.backup"
exports = ["@jess/backup"]

[[layer]]
id = "jess.http"
exports = ["@jess/http"]
