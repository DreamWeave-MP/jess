# This site, built by the Luau generator and by Zola 0.22.1 from the same sources.
[site]
pages = 110
sections = 12
summary = "The whole site, 110 pages, builds in 0.46 s on one thread at 33 MB. Zola 0.22.1 builds the same sources in 0.88 s of wall time and 10.4 s of CPU across 16 threads, at 248 MB."
source = "tools/bench/site.jsl, median of five alternating builds, 2026-10-15"
