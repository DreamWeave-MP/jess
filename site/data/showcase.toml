workload = "serialize a Detour tile of 16,129 polygons with its BV tree"
value = "13.1 ms"
source = "jpk/recast-luau/bench/bench.jsl, tile, 16129 polygons, BV tree"

[[runtime]]
package = "@jessql"
workload = "order 100,000 rows by a number"
