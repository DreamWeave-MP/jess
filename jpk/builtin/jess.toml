manifest_version = 1

# jess's built-in package: the Luau tools jess itself is checked with, as Luau. It is the one
# package that may export under @jess/, jess's own namespace.

[package]
id = "org.dreamweave.jess"
version = "0.1.0"
jess_api = "1"
include = ["src"]
tests = ["tests/style/run.jsl", "tests/data/run.jsl", "tests/analysis/run.jsl"]

[modules]
"@jess/style" = "src/style/init.jsl"
"@jess/analysis" = "src/analysis/init.jsl"
"@jess/json" = "src/data/json.jsl"
"@jess/data/toml" = "src/data/toml.jsl"
"@jess/data/value" = "src/data/value.jsl"
"@jess/yaml" = "src/data/yaml.jsl"

[[layer]]
id = "jess.style"
exports = ["@jess/style", "@jess/analysis"]

[[layer]]
id = "jess.data"
exports = ["@jess/json", "@jess/data/toml", "@jess/data/value", "@jess/yaml"]
