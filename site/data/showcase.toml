# The landing page's numbers. Every figure was measured on the verified release build named in
# [context], on the machine named there, and names the file it came from. The page prints these
# as they are, so keep the wording beside a number when you update it, and update the source
# with it. Package benches live with their packages (jpk/<package>/BENCHMARKS.md); the native
# comparisons come from tools/bench/showcase.jsl and the site comparison from tools/bench/site.jsl.

[context]
runtime = "Luau 0.742 on L3i 2.1.0"
native = "Rust 2024, MSRV 1.92"
binary = "Jess 0.1.0 on l3i 2.1.0 (Luau 0.742)"
machine = "an Intel Core i7-10870H with 16 threads and 15 GB"
measured = "on 2026-10-15"
note = "Times are medians: of seven batches of about a tenth of a second for a package bench, of five alternating runs for a whole program. A bench compares its result with a pinned answer before and after timing, so a path that stops doing the work fails instead of posting a time. Base-against-head tables, which say how a change moved a package, are in each package's BENCHMARKS.md; the figures here are the current head."

# Whole programs over the user's real load order, against the native tool each package ports.
# tools/bench/showcase.jsl measures both sides the same way (fresh run folder, isolated home,
# GNU time for wall, CPU, and peak memory) and compares every file they wrote. Baseline:
# tools/bench/results/l3i-2.1.0-i7-10870h-showcase.json, 2026-10-15.
[[native]]
value = "15.8×"
label = "faster"
headline = "TES3Merge, 52 plugins"
detail = "0.69 s in Jess against 10.9 s for native TES3Merge over the same 69-file load order, with 45× less CPU and half the peak memory. The plugins are byte-identical apart from three documented differences in what native writes."
source = "tools/bench/showcase.jsl, median of five"

[[native]]
value = "3.7×"
label = "faster, 5.0× less memory"
headline = "Merged Lands, 15,571 LAND records"
detail = "3.14 s against 11.5 s, and 1.10 GiB against 5.55 GiB, merging 51 plugins' terrain. Every record the port writes is byte-identical to native's; native at its April 2026 head also writes 7,920 LAND records the port leaves out, which the harness reports as a mismatch rather than excusing."
source = "tools/bench/showcase.jsl, median of five"

[[native]]
value = "0.59 s"
label = "against 0.67 s native"
headline = "S3LightFixes, 2,743 lights"
detail = "The one the native used to win on wall time. The port spends 0.55 s of CPU against 2.52 s and 549 MiB against 1.44 GiB, and every output is identical. Starting it, resolving its packages, and loading their Luau takes about 0.12 s of that. Packing changes nothing."
source = "tools/bench/showcase.jsl, median of five"

# What the packages do in-process, each row from its package's bench on the same build: the median of three
# fresh runs of the bench filtered to the row, the row named after the file.
[[runtime]]
package = "@dream/physics2d"
workload = "step a world of 100,000 bodies"
value = "15.0 ms"
source = "jpk/dream-physics/bench/bench.jsl, dense: step 100,000 uniform bodies"

[[runtime]]
package = "@dream/scene"
workload = "build a scene of 100,000 nodes in a batch"
value = "65.4 ms"
source = "jpk/dream-scene/bench/bench.jsl, build 100,000 nodes in a batch"

[[runtime]]
package = "@dream/scene"
workload = "move one leaf of 100,000 and update the bounds"
value = "4.2 µs"
source = "jpk/dream-scene/bench/bench.jsl, flat: move a leaf and back, an update after each"

[[runtime]]
package = "@dream/http"
workload = "dispatch GET /health through the router"
