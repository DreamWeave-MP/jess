name: Corprus Crucible Manufacturing

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: main
    tags: ["*"]

permissions:
  contents: read

jobs:
  build:
    permissions:
      actions: write # the default-branch run modGlobalBuild starts, which v55 declares even when mod_template is off
      contents: write
      pages: write
      id-token: write
    uses: DreamWeave-MP/StroggForge/.github/workflows/rustGlobalBuild.yml@v65
    secrets: inherit
    with:
      binary_names: '["jess"]'
      binary_package: jess
      include_files: "README.md,LICENSE-MIT,LICENSE-APACHE"
      publish_docs: false
      cargo_publish: true
      msrv: auto
      # 64-bit ARM Linux, cross-compiled in StroggForge's EL9 builder with clang and lld against a
      # glibc 2.34 sysroot, under the same LLVM toolchain rule as the x86 build. Android stays off:
      # that job compiles with the NDK's clang (LLVM 18), which l3i's toolchain rule refuses next to
      # stable rustc's LLVM; it needs StroggForge to drive rustc's clang at the NDK sysroot first.
      enable_portmaster: true
      # Pushes to main refresh `dev`, not `development`: GitHub keeps this repository's `development`
      # tag for the immutable release it was frozen as on 2026-10-23, and never frees the name.
      development_release: dev

  # The jess image: this release's Linux jess and every platform's jess as a packing runtime, for
  # pipelines that run jess, built from the archives the build job staged in this run.
  image:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: DreamWeave-MP/StroggForge/.github/workflows/publishJessImage.yml@v65
    with:
      version: ${{ github.ref_name }}
