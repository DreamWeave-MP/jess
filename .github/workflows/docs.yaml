name: Docs Site

# The documentation is built by jess itself: the generator, org.dreamweave.site, is a package the
# workspace's jess.lock pins, restored from its publisher by `jess workspace sync --locked` and
# run by `jess workspace run --trusted jess-site-build`. There is no Zola here and no checkout of
# the generator; a clean clone and a jess binary are everything the build needs.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "site/**"
      - "tools/site/**"
      - "jess.lock"
      - "jess-workspace.toml"
      - "jpk/builtin/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yaml"
  push:
    branches: main
    paths:
      - "site/**"
      - "tools/site/**"
      - "jess.lock"
      - "jess-workspace.toml"
      - "jpk/builtin/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yaml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The docs build is not a measurement, so it takes the development build: clang and lld link
      # without cross-language LTO, as tools/dev/no-lto.sh arranges for an edit loop.
      - name: Build jess
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          . tools/dev/no-lto.sh
          cargo build --release --locked
          echo "$CARGO_TARGET_DIR/release" >> "$GITHUB_PATH"

      # The generator, exactly as jess.lock pins it, from its publisher: the dreamweave-site site,
      # whose first release the lock has pinned since the DreamWeave sites came up.
      - name: Restore the pinned site generator
        run: jess workspace sync --locked

      - name: Build the site
        run: jess workspace run --trusted jess-site-build -- site/public

      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
