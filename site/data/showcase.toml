# Landing-page receipts. These are deliberately workload-specific engineering measurements, not
# hardware-independent promises. Keep the wording beside each number when updating it.

[tes3merge]
value = "21.2×"
label = "faster"
headline = "TES3Merge workload"
detail = "0.49 s in Jess/Dreamwind vs 10.5 s in the native original; median of five showcase runs."

[mergedlands]
value = "7.2×"
label = "less peak memory"
headline = "Merged Lands workload"
detail = "774 MiB in Jess/Dreamwind vs 5.44 GiB in the native original on the same load order."

[physics_raycast]
value = "~880×"
label = "faster"
headline = "100k-body scalar raycast"
detail = "Grid DDA replaced the O(N) scan: ~2.1–2.3 ms vs ~1.92 s while preserving the hit result."

[scene_idle]
value = "~42,834×"
label = "lower"
headline = "100k-node idle scene update"
detail = "0.000406 ms after incremental bounds, down from 17.391 ms rebuilding the whole scene."

[http_router]
value = "2.38M"
label = "requests / second"
headline = "Luau HTTP router"
detail = "Two million mixed exact-route requests through the reusable request-view hot path."

[physics_snapshot]
value = "~100M"
label = "body records / second"
headline = "Bulk simulation snapshots"
detail = "Ten million 40-byte records emitted in ~100 ms from Luau-owned packed state."

[recast_lookup]
value = "12.6 ms"
label = "for 100k lookups"
headline = "4096-tile Detour lookup"
detail = "Hashed tiled lookup; the linear comparison was ~2639 ms on the same representative run."
